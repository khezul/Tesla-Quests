<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tesla Quests</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root { --red:#E31937; --dark:#0a0a0a; --card:#111; --border:#222; --text:#f0f0f0; --muted:#666; --green:#00e676; --mono:'Space Mono',monospace; --sans:'Syne',sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--dark); color:var(--text); font-family:var(--sans); min-height:100vh; padding:24px 16px 60px; }

  .header { text-align:center; margin-bottom:32px; }
  .logo { font-size:11px; letter-spacing:0.3em; color:var(--red); font-family:var(--mono); text-transform:uppercase; margin-bottom:12px; }
  h1 { font-size:clamp(2rem,8vw,3rem); font-weight:800; line-height:1; letter-spacing:-0.03em; }
  h1 span { color:var(--red); }
  .subtitle { font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:10px; }

  .progress-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px 16px; margin-bottom:20px; }
  .prog-header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; }
  .prog-title { font-size:14px; font-weight:700; }
  .prog-count { font-family:var(--mono); font-size:22px; font-weight:700; color:var(--red); }
  .prog-bar-bg { background:#1a1a1a; border-radius:999px; height:8px; overflow:hidden; margin-bottom:10px; }
  .prog-bar-fill { height:100%; border-radius:999px; background:linear-gradient(90deg,var(--red),#ff6b6b); transition:width 0.4s; }
  .prog-sub { font-family:var(--mono); font-size:9px; color:var(--muted); display:flex; justify-content:space-between; }

  .filter-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
  .filter-btn { background:var(--card); border:1px solid var(--border); border-radius:999px; color:var(--muted); font-family:var(--mono); font-size:10px; padding:6px 14px; cursor:pointer; transition:all 0.2s; opacity:0.4; }
  .filter-btn.active { border-color:var(--red); color:var(--red); opacity:1; }
  .filter-btn.fw.active { border-color:var(--green); color:var(--green); }
  .filter-btn.fs.active { border-color:#ffc800; color:#ffc800; }
  .filter-btn.fg.active { border-color:#64b4ff; color:#64b4ff; }
  .filter-btn:not(.active):hover { opacity:0.7; }

  .quest-month { font-family:var(--mono); font-size:9px; letter-spacing:0.2em; color:var(--red); text-transform:uppercase; margin:20px 0 10px; }
  .quest-item { display:flex; align-items:flex-start; gap:12px; padding:14px; background:var(--card); border:1px solid var(--border); border-radius:12px; margin-bottom:8px; cursor:pointer; transition:opacity 0.2s; }
  .quest-item.done { opacity:0.35; }
  .quest-item.done .quest-title { text-decoration:line-through; }
  .quest-item.hidden { display:none; }
  .quest-cb { width:20px; height:20px; min-width:20px; border:1.5px solid var(--muted); border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:12px; margin-top:1px; }
  .quest-item.done .quest-cb { background:var(--green); border-color:var(--green); color:#000; }
  .quest-title { font-size:13px; font-weight:700; line-height:1.3; margin-bottom:3px; }
  .quest-desc { font-family:var(--mono); font-size:10px; color:var(--muted); line-height:1.6; }
  .quest-tag { font-family:var(--mono); font-size:8px; padding:3px 7px; border-radius:4px; margin-left:auto; white-space:nowrap; align-self:flex-start; }
  .ta { background:rgba(227,25,55,0.15); color:var(--red); }
  .tw { background:rgba(0,230,118,0.1); color:var(--green); }
  .ts { background:rgba(255,200,0,0.1); color:#ffc800; }
  .tg { background:rgba(100,180,255,0.1); color:#64b4ff; }
  .quest-list::-webkit-scrollbar { width:3px; }
  .quest-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

  .back-btn { display:block; text-align:center; margin-bottom:24px; font-family:var(--mono); font-size:11px; color:var(--muted); text-decoration:none; padding:10px; border:1px solid var(--border); border-radius:10px; }
  .back-btn:hover { border-color:var(--red); color:var(--red); }
</style>
</head>

  <button class="filter-btn" onclick="setFilter('open', this)">Offen</button>
</div>

<div id="q-list"></div>

var tagLabel = {a:'Aktion',w:'Wissen',s:'Spass',g:'Geld'};
var tagClass = {a:'ta',w:'tw',s:'ts',g:'tg'};

function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  renderQuests();
}

function renderQuests() {
  var html = '';
  var month = 0;
  var done = Object.values(qDone).filter(Boolean).length;
  document.getElementById('q-done').textContent = done;
  document.getElementById('q-bar').style.width = done + '%';
  document.getElementById('q-remain').textContent = (100 - done) + ' ausstehend';

  for (var i = 0; i < quests.length; i++) {
    var q = quests[i];
    var isDone = !!qDone[i];
    var show = activeFilter === 'all' ||
               activeFilter === q.c ||
               (activeFilter === 'open' && !isDone);
    if ((q.w - 1) % 4 === 0) { month++; if (show) html += '<div class="quest-month">Monat ' + month + '</div>'; }
    if (!show) continue;
    var doneClass = isDone ? ' done' : '';
    var check = isDone ? '&#10003;' : '';
    html += '<div class="quest-item' + doneClass + '" onclick="toggleQ(' + i + ')">' +
      '<div class="quest-cb">' + check + '</div>' +
      '<div style="flex:1"><div class="quest-title">W' + q.w + ': ' + q.t + '</div><div class="quest-desc">' + q.d + '</div></div>' +
      '<span class="quest-tag ' + tagClass[q.c] + '">' + tagLabel[q.c] + '</span></div>';
  }
  document.getElementById('q-list').innerHTML = html;
}

function toggleQ(i) {
  qDone[i] = !qDone[i];
  localStorage.setItem('tf-q', JSON.stringify(qDone));
  renderQuests();
}

renderQuests();
</script>
